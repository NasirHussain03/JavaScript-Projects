<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object to represent a product in myntra</title>
</head>
<body>
  <script>
    // create an object to represent a product from myntra 
    let product= {
      size: 'S',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'same day delivery',
    }
    // create an object with 2 references and log changes to one object by changing the other one 
    let copyProduct= product;
    console.log(product);
    copyProduct.size = 'M';
    console.log(product);
    copyProduct.size = 'Regular Fit';
    console.log(product);

    // use bracket noitation [] to display 'delivery-time'
    console.log(product['delivery-time']);

    // Given an object{ message: 'good job', status:'Complete'}, use de-structuring to create 2 variables message and status
    let obj= {
      message: 'Good Job',
      status: 'Complete',
    }
    console.log(obj);
    let {message, status} = obj;
    console.log(message);
    console.log(status);

    // Add function is IdenticalProduct to compare 2 product objects.
    function isIdenticalProduct(product1, product2){
      if (typeof(product1) !== 'object' || typeof(product2) !== 'object' ){
        console.warn('Parameter passed was not an object');
        return false;
      }
      if (product1 == product2) {
        return true;
      }
      if (product1.name ==  product2.name && product1.size ==  product2.size && product1.fit ==  product2.fit){
        return true;
      }else {
        return false;
      }
    }

    let product1= {
      size: 'S',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'same day delivery',
    }

    let product2= {
      size: 'M',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'same day delivery',
    }
    let product3= {
      size: 'M',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'same day delivery',
    }

    console.log(isIdenticalProduct(product1, 'product2'));
    console.log(isIdenticalProduct(product1, product1));
    console.log(isIdenticalProduct(product1, product2));
    console.log(isIdenticalProduct(product2, product3));
    console.log(isIdenticalProduct(product3, product2));
  </script>
  
</body>
</html>
