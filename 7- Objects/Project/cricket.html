<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bat Ball Stump Game </title>
  <style>
    .body{
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  <button onclick="
  let coumputerChoise = generateComputerChoice();
  let resultMsg = getResult('Bat', coumputerChoise);
  showResult(`Bat`, coumputerChoise, resultMsg);
  ">Bat</button>

  <button onclick="
  coumputerChoise = generateComputerChoice();
  resultMsg = getResult('Ball', coumputerChoise);
  showResult('Ball', coumputerChoise, resultMsg);
  ">Ball</button>

  <button onclick="
  coumputerChoise = generateComputerChoice();
  resultMsg = getResult('Stump', coumputerChoise);
  showResult('Stump', coumputerChoise, resultMsg);"
  >Stump</button>

  <script>
    let score = {
      won: 0,
      lost: 0,
      tie: 0,
      displayScore: function(){
        return `No of Matches Won: ${score.won}, Lost: ${score.lost}, Tie: ${score.tie}`;
      }
    };



    function generateComputerChoice(){
      let randomNumber = Math.random() * 3 ;
      if (randomNumber>0 && randomNumber<=1){
        return 'Bat';
        // console.log('computer choise is Bat');
      }
      else if(randomNumber>1 && randomNumber<=2){
        return 'Ball';
        // console.log('computer choise is Ball');
      }
      else{
        return 'Stump';
        // console.log('computer choise is Stump');
      }
    }

    function getResult(userMove, computerMove){
      if (userMove === 'Bat'){
        if(computerMove === 'Bat'){
          score.tie++;
          return `It's a Tie`;
        }
        else if(computerMove === 'Stump'){
          score.lost++;
          return `Computer Won`;
        }
        else if(computerMove === 'Ball'){
          score.won++;
          return 'You won';
        }
      }
      else if(userMove === 'Ball'){
        if(coumputerChoise === 'Ball'){
          score.tie++;
          return `It's a Tie`;
        }
        else if(computerMove  === 'Bat'){
          score.lost++;
          return `Computer Won`;
        }
        else if(computerMove  === 'Stump'){
          score.won++;
         return 'You won';
        }
      }
      else{
        if(computerMove  === 'Ball'){
          score.lost++;
          return 'Computer Won';
        }
        else if(computerMove  === 'Bat'){
          score.won++;
          return 'You won';
        }
        else if(computerMove  === 'Stump'){
          score.tie++;
          return `It's a Tie`;
        }
      }
    }

    function showResult(userMove, computerMove, result){
      console.log(score);
      alert(`Your choise is ${userMove}. Computer Choise is ${computerMove} 
      
      ${result}

      ${score.displayScore()}`);
    }
  </script>
</body>
</html>
