<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odd or Even</title>
</head>
<body>
  <h1>Odd or Even</h1>

  <script>
    let num;
    function numberIs(num){
      if(num % 2 == 0){
        return 'Number is even';
      }else{
        return 'Number is Odd';
      }
    }

    console.log(numberIs(555));
    console.log(numberIs(232532));
  </script>
</body>
</html>
