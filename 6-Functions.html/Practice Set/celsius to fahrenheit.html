<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celsius to Fahrenheit</title>
</head>
<body>
  <script>

    function celTaFah(celsius){
      let fahrenheit = (9/5)*celsius +32;
      return fahrenheit;
    }

    console.log(celTaFah(38));
    console.log(celTaFah(0));
    console.log(celTaFah(100));
  </script>
</body>
</html>
