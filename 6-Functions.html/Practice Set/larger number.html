<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odd or Even</title>
<body>
  <script>
    function largerNo(a,b){
      if(a>b){
        return a;
      }else{
        return b;
      }
    }

    console.log(largerNo(8,11));
    console.log(largerNo(665,8521));
    console.log(largerNo(5,5));

    function larger(num1, num2){
      return num1 > num2 ? num1 : num2;
    }

    console.log(larger(8, 11));
    console.log(larger(665, 8521));
    console.log(larger(5, 5));
  </script>
</body>
</html>
