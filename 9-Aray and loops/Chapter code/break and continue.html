<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Break and continue </title>
</head>
<body>
  <script>
    for (let i=1; i<=50; i++){
      console.log(i);
      if (i===34){
        break;
      }
    }

    let arr= [5,8,54,89,2,52];
    for (let i=1; i<arr.length; i++){
      if (arr[i]=== 2){
        console.log(`number found at index ${i}`);
        break;
      }
      console.log('still looking');
    }

    let arr2 = [5,48,4,3,9,11,19,5,20,52,68];
    for (let i=0; i<arr2.length; i++){
      if (arr2[i]<25 && arr2[i]%2 !==0){
        console.log(arr2[i]);
      }
    }

    for (let i=1; i<=25; i++){
      if (i % 2== 0){
        continue;
      }
      console.log(i);
    }
  </script>
</body>
</html>
