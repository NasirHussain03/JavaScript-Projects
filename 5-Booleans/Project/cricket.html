  <button onclick="console.log('You have choosen Bat');

    // console.log('computer choise is Stump');

  }

    resultMsg = `It's a Tie`;
  }
  else if(coumputerChoise === 'Stump'){
    resultMsg = 'Computer won';
  }
  
  alert(` You have choosen Bat. Computer Choise is ${coumputerChoise} and ${resultMsg}`);
